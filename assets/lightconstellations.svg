<svg xmlns="http://www.w3.org/2000/svg" width="854" height="330" viewBox="0 0 854 330" role="img" aria-label="My skills drawn as three constellations made of dots: languages, web and data, tools and creative">
  <title>Skills as constellations</title>
 
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .label { font-size: 12px; fill: #24292f; text-anchor: middle; }
    .title { font-size: 15px; font-weight: 700; fill: #24292f; text-anchor: middle; }
    .sub   { font-size: 10px; fill: #8c959f; text-anchor: middle; letter-spacing: 1px; }
    /* every dot in the picture uses this one color */
    .dots  { fill: none; stroke: #24292f; stroke-linecap: round; }
    /* constellation lines are rows of whole dots that slowly flow along the line */
    .line  { fill: none; stroke: #24292f; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 0 7; stroke-opacity: .5; }
  </style>
 
  <defs>
    <!-- A star is a small cross of dots on a grid. It blinks between a "+" and an "x". -->
    <path id="star-plus" d="M0 0h.01 M3.6 0h.01 M-3.6 0h.01 M0 3.6h.01 M0 -3.6h.01 M7.2 0h.01 M-7.2 0h.01 M0 7.2h.01 M0 -7.2h.01"/>
    <path id="star-x"    d="M0 0h.01 M3.2 3.2h.01 M-3.2 3.2h.01 M3.2 -3.2h.01 M-3.2 -3.2h.01 M6.4 6.4h.01 M-6.4 6.4h.01 M6.4 -6.4h.01 M-6.4 -6.4h.01"/>
  </defs>
 
  <!-- background -->
  <rect width="854" height="330" rx="10" fill="#ffffff" stroke="#d0d7de"/>
 
  <!-- tiny background stars, a few of them twinkle -->
  <g fill="#24292f">
    <circle cx="24"  cy="40"  r="1"   opacity=".6"/>
    <circle cx="70"  cy="250" r="1.2" opacity=".5"/>
    <circle cx="118" cy="40"  r="0.8" opacity=".7"/>
    <circle cx="200" cy="225" r="1"   opacity=".4"/>
    <circle cx="262" cy="60"  r="1.2" opacity=".6"/>
    <circle cx="290" cy="270" r="0.9" opacity=".5"/>
    <circle cx="330" cy="30"  r="1"   opacity=".7"/>
    <circle cx="372" cy="215" r="0.8" opacity=".4"/>
    <circle cx="520" cy="35"  r="1.1" opacity=".6"/>
    <circle cx="548" cy="210" r="1"   opacity=".5"/>
    <circle cx="575" cy="120" r="0.9" opacity=".6"/>
    <circle cx="600" cy="280" r="1.2" opacity=".4"/>
    <circle cx="610" cy="45"  r="1"   opacity=".7"/>
    <circle cx="640" cy="215" r="0.8" opacity=".5"/>
    <circle cx="820" cy="40"  r="1.1" opacity=".6"/>
    <circle cx="832" cy="200" r="1"   opacity=".5"/>
    <circle cx="820" cy="280" r="0.9" opacity=".6"/>
    <circle cx="470" cy="290" r="1"   opacity=".4"/>
    <circle cx="380" cy="100" r="0.8" opacity=".6"/>
    <circle cx="40"  cy="300" r="1"   opacity=".4"/>
    <circle cx="150" cy="270" r="1.1">
      <animate attributeName="opacity" values="1;.2;1" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="505" cy="85" r="1.1">
      <animate attributeName="opacity" values="1;.2;1" dur="4.3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="790" cy="110" r="1.1">
      <animate attributeName="opacity" values="1;.2;1" dur="3.7s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>
 
  <!-- one shooting star (a head with a short dotted tail), passes by every 11 seconds -->
  <g opacity="0" fill="#24292f">
    <circle r="2.2"/>
    <circle cx="-9"  cy="-1" r="1.7" opacity=".8"/>
    <circle cx="-18" cy="-2" r="1.3" opacity=".6"/>
    <circle cx="-27" cy="-3" r="1"   opacity=".4"/>
    <circle cx="-36" cy="-4" r="0.7" opacity=".25"/>
    <animateTransform attributeName="transform" type="translate" values="-80 30; 900 140; 900 140" keyTimes="0; .3; 1" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0; 1; 0; 0" keyTimes="0; .05; .3; 1" dur="11s" repeatCount="indefinite"/>
  </g>
 
 
  <!-- ============ LANGUAGES  (shaped like Cassiopeia, the "W") ============ -->
  <g id="languages">
    <polyline class="line" points="52,170 97,100 142,160 190,95 236,150">
      <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="2.4s" repeatCount="indefinite"/>
    </polyline>
 
    <g class="dots" stroke-width="2.2">
      <g transform="translate(52 170)">
        <use href="#star-plus"><animate attributeName="opacity" values="1;0;1" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" repeatCount="indefinite"/></use>
        <use href="#star-x" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" repeatCount="indefinite"/></use>
      </g>
      <g transform="translate(97 100)">
        <use href="#star-plus"><animate attributeName="opacity" values="1;0;1" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin=".5s" repeatCount="indefinite"/></use>
        <use href="#star-x" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin=".5s" repeatCount="indefinite"/></use>
      </g>
      <g transform="translate(142 160)">
        <use href="#star-plus"><animate attributeName="opacity" values="1;0;1" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin="1s" repeatCount="indefinite"/></use>
        <use href="#star-x" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin="1s" repeatCount="indefinite"/></use>
      </g>
      <g transform="translate(190 95)">
        <use href="#star-plus"><animate attributeName="opacity" values="1;0;1" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin=".3s" repeatCount="indefinite"/></use>
        <use href="#star-x" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin=".3s" repeatCount="indefinite"/></use>
      </g>
      <g transform="translate(236 150)">
        <use href="#star-plus"><animate attributeName="opacity" values="1;0;1" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin="1.4s" repeatCount="indefinite"/></use>
        <use href="#star-x" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin="1.4s" repeatCount="indefinite"/></use>
      </g>
    </g>
 
    <text class="label" x="52"  y="194">C/C++</text>
    <text class="label" x="97"  y="82">Python</text>
    <text class="label" x="142" y="184">Java</text>
    <text class="label" x="190" y="77">JavaScript</text>
    <text class="label" x="236" y="174">TypeScript</text>
 
    <text class="title" x="142" y="294">Languages</text>
    <text class="sub"   x="142" y="311">CASSIOPEIA</text>
  </g>
 
 
  <!-- ============ WEB & DATA  (shaped like Cygnus, the Northern Cross) ============ -->
  <g id="web-and-data">
    <polyline class="line" points="427,68 427,140 427,245">
      <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="2.8s" repeatCount="indefinite"/>
    </polyline>
    <polyline class="line" points="362,140 427,140 492,140">
      <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="2.8s" repeatCount="indefinite"/>
    </polyline>
 
    <g class="dots" stroke-width="2.2">
      <g transform="translate(427 68)">
        <use href="#star-plus"><animate attributeName="opacity" values="1;0;1" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin=".2s" repeatCount="indefinite"/></use>
        <use href="#star-x" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin=".2s" repeatCount="indefinite"/></use>
      </g>
      <g transform="translate(362 140)">
        <use href="#star-plus"><animate attributeName="opacity" values="1;0;1" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin=".8s" repeatCount="indefinite"/></use>
        <use href="#star-x" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin=".8s" repeatCount="indefinite"/></use>
      </g>
      <g transform="translate(492 140)">
        <use href="#star-plus"><animate attributeName="opacity" values="1;0;1" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></use>
        <use href="#star-x" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></use>
      </g>
      <g transform="translate(427 140) scale(1.25)">
        <use href="#star-plus"><animate attributeName="opacity" values="1;0;1" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin=".6s" repeatCount="indefinite"/></use>
        <use href="#star-x" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin=".6s" repeatCount="indefinite"/></use>
      </g>
      <g transform="translate(427 245)">
        <use href="#star-plus"><animate attributeName="opacity" values="1;0;1" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin="1.7s" repeatCount="indefinite"/></use>
        <use href="#star-x" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin="1.7s" repeatCount="indefinite"/></use>
      </g>
    </g>
 
    <text class="label" x="427" y="48">React</text>
    <text class="label" x="362" y="122">HTML5</text>
    <text class="label" x="492" y="122">CSS3</text>
    <text class="label" x="427" y="172">MySQL</text>
    <text class="label" x="427" y="269">PostgreSQL</text>
 
    <text class="title" x="427" y="294">Web &amp; Data</text>
    <text class="sub"   x="427" y="311">CYGNUS</text>
  </g>
 
 
  <!-- ============ TOOLS & CREATIVE  (shaped like Orion) ============ -->
  <g id="tools-and-creative">
    <!-- shoulders down to the belt, then the belt, then the foot -->
    <polyline class="line" points="655,70 665,150">
      <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="2.6s" repeatCount="indefinite"/>
    </polyline>
    <polyline class="line" points="770,78 759,170">
      <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="2.6s" repeatCount="indefinite"/>
    </polyline>
    <polyline class="line" points="665,150 712,160 759,170">
      <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="2.6s" repeatCount="indefinite"/>
    </polyline>
    <polyline class="line" points="759,170 740,245">
      <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="2.6s" repeatCount="indefinite"/>
    </polyline>
 
    <g class="dots" stroke-width="2.2">
      <g transform="translate(655 70)">
        <use href="#star-plus"><animate attributeName="opacity" values="1;0;1" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin=".1s" repeatCount="indefinite"/></use>
        <use href="#star-x" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin=".1s" repeatCount="indefinite"/></use>
      </g>
      <g transform="translate(770 78)">
        <use href="#star-plus"><animate attributeName="opacity" values="1;0;1" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin=".9s" repeatCount="indefinite"/></use>
        <use href="#star-x" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin=".9s" repeatCount="indefinite"/></use>
      </g>
      <g transform="translate(665 150)">
        <use href="#star-plus"><animate attributeName="opacity" values="1;0;1" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin="1.5s" repeatCount="indefinite"/></use>
        <use href="#star-x" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin="1.5s" repeatCount="indefinite"/></use>
      </g>
      <g transform="translate(712 160)">
        <use href="#star-plus"><animate attributeName="opacity" values="1;0;1" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin=".4s" repeatCount="indefinite"/></use>
        <use href="#star-x" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin=".4s" repeatCount="indefinite"/></use>
      </g>
      <g transform="translate(759 170)">
        <use href="#star-plus"><animate attributeName="opacity" values="1;0;1" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin="1.9s" repeatCount="indefinite"/></use>
        <use href="#star-x" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin="1.9s" repeatCount="indefinite"/></use>
      </g>
      <g transform="translate(740 245) scale(1.25)">
        <use href="#star-plus"><animate attributeName="opacity" values="1;0;1" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin=".7s" repeatCount="indefinite"/></use>
        <use href="#star-x" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;.5;1" calcMode="discrete" dur="2.4s" begin=".7s" repeatCount="indefinite"/></use>
      </g>
    </g>
 
    <text class="label" x="655" y="52">Git</text>
    <text class="label" x="770" y="60">GitHub</text>
    <text class="label" x="665" y="174">VS Code</text>
    <text class="label" x="712" y="142">Figma</text>
    <text class="label" x="759" y="194">Drawing</text>
    <text class="label" x="740" y="272">Creative Writing</text>
 
    <text class="title" x="712" y="294">Tools &amp; Creative</text>
    <text class="sub"   x="712" y="311">ORION</text>
  </g>
</svg>
 
